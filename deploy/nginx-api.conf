# Include INSIDE the existing HTTPS server block. Build with VITE_API_URL=/api.
# The trailing slash on proxy_pass strips /api/ before forwarding to NestJS.
# /admin/offers, /admin/coupons, etc. remain frontend pages, while requests such
# as /api/admin/offers consistently reach the backend.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
