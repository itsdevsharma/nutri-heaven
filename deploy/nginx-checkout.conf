# Include this snippet INSIDE the existing nutriheaven.co.in HTTPS server block.
# Change the upstream port if the production NestJS API does not use port 3000.
# Exact matches prevent Nginx's automatic slash redirect for proxied prefixes.
location = /checkout {
    try_files /index.html =404;
}

location = /checkout/ {
    return 308 /checkout;
}

# Only subpaths such as /checkout/configuration and /checkout/quotes use the API.
location ^~ /checkout/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
