# Include inside HTTPS server, replacing SPA and legacy API locations.
# Keep the existing root and TLS/Certbot directives.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self' https://checkout.razorpay.com https://connect.facebook.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https:; frame-src https://api.razorpay.com https://checkout.razorpay.com; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options DENY always;
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
include /etc/nginx/snippets/nutri-api.conf;

location ^~ /assets/ { try_files $uri =404; expires 1d; }
location = /NUTRI-HEAVEN-FSSAI-RC.pdf { try_files $uri =404; }
location = /favicon.ico { try_files /assets/nutri-heaven-logo.jpeg =404; }
location ^~ /uploads/ { proxy_pass http://127.0.0.1:3000; }

# Preserve old API paths, including the Razorpay webhook. HTML navigation
# renders the original path instead of rewriting every title to the homepage.
location ~ ^/(health|auth|customer|categories|cart|orders|storefront|payments|inventory|coupons|newsletter|reviews|checkout/(configuration|quotes)|admin/(auth|cms|media|settings|offers|coupons|audit|users|engagement|shipping))(/|$) {
    error_page 418 = @nutri_html;
    if ($http_accept ~* "text/html") { return 418; }
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location = /products { proxy_pass http://127.0.0.1:3000; }
location = /products/quote { proxy_pass http://127.0.0.1:3000; }
location = /products/browse { proxy_pass http://127.0.0.1:3000; }
location @nutri_html {
    proxy_pass http://127.0.0.1:3001;
    proxy_set_header Host $host;
}
location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
